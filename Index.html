<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宴会・婚礼予約入力 v7</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --dark: #111827;
      --soft: #f3f4f6;
      --danger: #fee2e2;
      --warning: #ffedd5;
      --success: #dcfce7;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1380px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    .sub {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.95fr;
      gap: 18px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .today-summary {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-weight: 800;
      color: var(--text);
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: #fff;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 800;
    }
    .order-details-hidden {
  display: none;
}
.allergy-person-card.collapsed > :not(.allergy-person-head) {
  display: none;
}

    .grid-2,
    .grid-3,
    .grid-4 {
      display: grid;
      gap: 10px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .field {
      margin-bottom: 12px;
    }

    .label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
    }

    .textarea {
      resize: vertical;
      min-height: 90px;
    }

    .button-row,
    .pill-row,
    .action-row,
    .badge-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn-dark {
      background: var(--dark);
      color: #fff;
    }

    .btn-light {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn-danger {
      background: var(--danger);
      color: #991b1b;
    }

    .btn-warning {
      background: var(--warning);
      color: #9a3412;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .helper {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 4px;
    }

    .items-area,
    .list,
    .task-list,
    .report-list,
    .mini-list,
    .allergy-area {
      display: grid;
      gap: 10px;
    }

    .item-card,
    .order-card,
    .task-card,
    .report-card,
    .allergy-person-card,
    .allergy-wrapper {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: #fff;
    }

    .item-head,
    .order-top,
    .task-head,
    .allergy-person-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .allergy-person-card.collapsed > :not(.allergy-person-head) {
      display: none !important;;
    }

    .allergy-person-head {
      cursor: pointer;
    }

    .item-title {
      font-size: 16px;
      font-weight: 800;
    }
    .item-card.collapsed > :not(.item-head) {
      display: none !important;
    }

    .item-head {
      cursor: pointer;
    }

    .order-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .order-card.task {
      border: 2px solid #f59e0b;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: var(--soft);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .mini-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fafafa;
    }
   .order-table-wrap {
  overflow-x: auto;
}

.order-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.order-table th,
.order-table td {
  border-bottom: 1px solid var(--line);
  padding: 8px 6px;
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
}

.order-table th {
  color: var(--muted);
  font-size: 12px;
}

.order-table button {
  padding: 6px 8px;
  font-size: 12px;
}
    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: #fafafa;
    }

    .hidden {
      display: none !important;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .pill.active {
      background: var(--dark);
      color: #fff;
      border-color: var(--dark);
    }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .check-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .allergy-person-title,
    .task-title,
    .report-title {
      font-size: 15px;
      font-weight: 800;
    }

    .family-box {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #fff;
    }

    .family-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .family-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .family-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
      background: #fafafa;
    }

    .family-item label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .allergy-summary {
      margin-top: 6px;
      color: #9a3412;
      font-size: 12px;
      font-weight: 700;
    }

    .task-check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fafafa;
      margin-top: 8px;
    }

    .task-check.done {
      opacity: 0.55;
      text-decoration: line-through;
    }

    .task-check input {
      margin-top: 4px;
      transform: scale(1.15);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-panel {
      width: min(1150px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
      padding: 18px;
    }

    .modal-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .print-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .allergy-card {
      min-height: 165px;
      height: auto;
      overflow: visible;
    }

    .allergy-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .allergy-title {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
    }

    .allergy-sub {
      font-size: 10px;
      color: #4b5563;
      line-height: 1.35;
    }

    .allergy-label {
      font-size: 9px;
      font-weight: 800;
      color: #6b7280;
      letter-spacing: .03em;
    }

    .allergy-box {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 6px 8px;
      background: #fafafa;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
      min-height: 34px;
      overflow: hidden;
    }

    .allergy-card.compact {
      padding: 10px;
      gap: 6px;
    }

    .allergy-card.compact {
      padding: 10px;
      gap: 6px;
    }

    .compact-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    .compact-main {
      min-width: 0;
      flex: 1;
    }

    .compact-title {
      font-size: 12px;
      line-height: 1.2;
      margin: 0;
      white-space: normal;
      overflow: visible;
      word-break: break-word;
    }

    .compact-sub {
      font-size: 10px;
      line-height: 1.2;
      margin-top: 2px;
      color: #4b5563;
      white-space: normal;
      overflow: visible;
      word-break: break-word;
    }

    .person-badge {
      width: 54px;
      height: 54px;
      border-radius: 999px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: #111827;
      flex-shrink: 0;
    }

    .compact-line {
      font-size: 10px;
      line-height: 1.3;
      white-space: normal;
      overflow: visible;
      word-break: break-word;
    }

    .view-hidden {

      display: none !important;

    }

    .date-range-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      margin-bottom: 12px;
    }

    .date-range-row .field {
      margin-bottom: 0;
    }

    .date-range-sep {
      text-align: center;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 12px;
    }

    @media (max-width:1024px) {

      .layout,
      .grid-3,
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .category-grid,
      .grid-4,
      .check-grid,
      .family-list,
      .print-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .date-range-row {
        grid-template-columns: 1fr;
      }

      .date-range-sep {
        display: block;
        text-align: center;
        padding: 0;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }

      html,
      body {
        width: 210mm;
        height: 297mm;
        margin: 0;
        padding: 0;
        background: #fff;
      }

      body * {
        visibility: hidden;
      }

      #printModal,
      #printModal * {
        visibility: visible;
      }

      #printModal {
        position: absolute;
        inset: 0;
        background: #fff;
        padding: 0;
        margin: 0;
      }

      #printModal .modal-panel {
        width: 100%;
        max-height: none;
        overflow: visible;
        box-shadow: none;
        border-radius: 0;
        padding: 0;
        margin: 0;
      }

      #printModal .modal-toolbar {
        display: none !important;
      }

      #printCardsArea.print-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8mm;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .allergy-card {
        min-height: 80mm;
        height: auto;
        overflow: visible;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .allergy-title {
        font-size: 11pt;
        line-height: 1.2;
      }

      .allergy-sub {
        font-size: 8pt;
        line-height: 1.25;
      }

      .allergy-label {
        font-size: 7pt;
        line-height: 1.2;
      }

      .allergy-box {
        font-size: 8pt;
        line-height: 1.25;
        min-height: 10mm;
        max-height: 15mm;
        overflow: hidden;
        border-radius: 2mm;
      }

      .compact-title {
        font-size: 9pt;
      }

      .compact-sub {
        font-size: 7.5pt;
      }

      .person-badge {
        width: 13mm;
        height: 13mm;
        font-size: 7.5pt;
      }

      .compact-line {
        font-size: 7.5pt;
        line-height: 1.15;
      }
    }
    .section-box {
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .section-header {
      padding: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #fff;
    }

    .section-content {
      padding: 14px;
    }

    .section-content.hidden {
      display: none;
    }
   .order-detail-panel {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  background: #fff;
}

.order-detail-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 8px;
}

.order-detail-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
@media (max-width: 600px) {
  .app {
    padding: 10px;
  }

  .title {
    font-size: 22px;
  }

  .sub {
    display: none;
  }

  .header {
    gap: 8px;
    margin-bottom: 10px;
  }

  .action-row {
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 6px;
  }

  .action-row button {
    white-space: nowrap;
    padding: 10px 12px;
    font-size: 13px;
  }

  .layout {
    display: block;
  }

  .card {
    padding: 14px;
    border-radius: 16px;
    margin-bottom: 12px;
  }

  .category-grid,
  .grid-2,
  .grid-3,
  .grid-4,
  .check-grid,
  .family-list {
    grid-template-columns: 1fr 1fr;
  }

  .section-title {
    font-size: 16px;
  }

  .today-summary {
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .order-table,
  .order-table thead,
  .order-table tbody,
  .order-table tr,
  .order-table td {
    display: block;
    width: 100%;
  }

  .order-table thead {
    display: none;
  }

  .order-table tr {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    padding: 10px;
    margin-bottom: 10px;
  }

  .order-table td {
    border-bottom: none;
    padding: 4px 0;
    white-space: normal;
  }

  .order-table td:nth-child(1)::before { content: "日付："; font-weight: 800; }
  .order-table td:nth-child(2)::before { content: "区分："; font-weight: 800; }
  .order-table td:nth-child(3)::before { content: "名前："; font-weight: 800; }
  .order-table td:nth-child(4)::before { content: "会場："; font-weight: 800; }
  .order-table td:nth-child(5)::before { content: "商品："; font-weight: 800; }
  .order-table td:nth-child(6)::before { content: "状態："; font-weight: 800; }

  .order-table td:nth-child(7) {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
}

  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div>
        <h1 class="title">宴会・婚礼予約入力 v7</h1>
        <div class="sub">UI維持 / アレルギー全体管理 / 旧データ自動変換 / 印刷ズレ修正版</div>
      </div>
      <div class="action-row">
        <input type="file" id="importJsonInput" accept=".json,application/json" hidden />
        <button class="btn-light" id="importJsonBtn">JSON読み込み</button>
        <button class="btn-light" id="exportBtn">JSON書き出し</button>
        <button class="btn-light" id="printCardsBtn">カード作成</button>
        <button class="btn-light" id="taskModalBtn">タスク確認</button>
        <button class="btn-light" id="monthlyReportBtn">月末集計</button>
        <button class="btn-light" id="resetFormBtn">入力リセット</button>
        <button class="btn-danger" id="clearAllBtn">全件削除</button>
        <button class="btn-light toggle-detail-btn">
  詳細
</button>
      </div>
    </div>
    <div class="pill-row" id="viewToggle">
      <button class="pill active" data-view="form">入力</button>
      <button class="pill" data-view="list">一覧</button>
    </div>
    <div class="today-summary" id="todaySummary"></div>

    <div class="layout">
      <section class="card">
        <h2 class="section-title">注文入力</h2>
        <div class="field">
          <label class="label">カテゴリ</label>
          <div class="category-grid" id="categoryGrid"></div>
          <div class="helper">ギフトは婚礼に統合済みです。婚礼の中で引き菓子・ギフト商品を追加できます。</div>
        </div>

        <form id="orderForm" novalidate>
          <div class="section-box">

            <div class="section-header">
              基本情報
            </div>

            <div class="section-content" id="basicInfoSection">
              <div class="grid-3">
                <div class="field">
                  <label class="label">日付</label>
                  <input class="input" type="date" id="orderDate" />
                </div>
                <div class="field">
                  <label class="label">時間</label>
                  <input class="input" type="time" id="orderTime" />
                </div>
                <div class="field">
                  <label class="label" id="nameLabel">宴会名 / 名前</label>
                  <input class="input" id="clientName" placeholder="例：田中様宴会 / 新郎新婦名 / 記念日名義" />
                </div>
              </div>

              <div class="grid-3">
                <div class="field">
                  <label class="label">会場 / 受け渡し場所</label>
                  <input class="input" id="venue" placeholder="例：鳳凰の間 / レストラン / フロント" list="savedVenueList" />
                </div>
                <div class="field" id="guestCountWrap">
                  <label class="label">人数</label>
                  <input class="input" type="number" id="guestCount" min="0" placeholder="例：50" />
                </div>
                <div class="field" id="coursePriceWrap">
                  <label class="label">コース料金</label>
                  <input class="input" type="number" id="coursePrice" min="0" placeholder="例：8000" />
                </div>
              </div>

              <div class="grid-2">
                <div class="field">
                  <label class="label">ステータス</label>
                  <select class="select" id="status">
                    <option>未確認</option>
                    <option>製造待ち</option>
                    <option>製造中</option>
                    <option>完成</option>
                    <option>納品済み</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="field" id="afternoonTeaWrap">
              <label class="label">アフタヌーンティー区分</label>
              <select class="select" id="afternoonTeaType">
                <option value="">未選択</option>
                <option>通常</option>
                <option>季節限定</option>
                <option>取材用</option>
                <option>その他</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label class="label">全体備考</label>
            <textarea class="textarea" id="orderNotes" placeholder="例：会場搬入 / 引き菓子同時納品 / アレルギー対応あり"></textarea>
          </div>

          <div class="field">
            <label class="label">アレルギー管理（予約全体）</label>
            <div class="allergy-wrapper">

    function loadOrders() {
      const candidateKeys = [
        'banquet_reservation_v7',
        'banquet_reservation_v6',
        'banquet_reservation_v5',
        'banquet_reservation_v4'
      ];

      for (const key of candidateKeys) {
        try {
          const raw = JSON.parse(localStorage.getItem(key) || '[]');

          if (Array.isArray(raw) && raw.length) {
            const normalized = raw.map(normalizeImportedOrder);

            if (key !== STORAGE_KEY) {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
            }

            return normalized;
          }

    function getGroupByFood(food) { return ALLERGY_MASTER[food]?.groups?.[0] || null; }
    function getRelatedGroupsFromPrimary(primary = []) { return [...new Set(primary.flatMap(name => ALLERGY_MASTER[name]?.groups || []))]; }
    function getRelevantFamilyFoods(primary = []) {
      if (!Array.isArray(primary) || !primary.length) return [];

      const groups = getRelatedGroupsFromPrimary(primary);
      return roseFamily.filter(food => groups.includes(getGroupByFood(food)));
    }
    function checkRecipeAgainstPerson(itemName, person) {
      const ingredients = RECIPE_MASTER[itemName] || [];
      const primary = person.primary || [];
      const direct = [];
      const group = [];
      ingredients.forEach(ing => {
        if (primary.includes(ing)) direct.push(ing);
        const ingGroup = getGroupByFood(ing);
        primary.forEach(p => {
          const pGroup = getGroupByFood(p);
          if (ingGroup && pGroup && ingGroup === pGroup && ing !== p) group.push(ing);
        });
      });
      return { direct: [...new Set(direct)], group: [...new Set(group)] };
    }

    function isInRange(date) {
      if (!date) return false;

      const d = new Date(date);

    function filteredOrders() {

          ['未確認', '製造待ち'].includes(order.status) ||
          (order.allergyMaster?.people || []).some(p => {
            const foods = getRelevantFamilyFoods(p.primary || []);
            return foods.some(f => (p.familyChecks?.[f] || '未確認') === '未確認');
          });

        const matchFilter =
          activeFilter === '全件' ? true :
            activeFilter === '今日' ? order.date === todayStr(0) :
              activeFilter === '明日' ? order.date === todayStr(1) :
                activeFilter === '今週' ? isThisWeek(order.date) :
                  activeFilter === '未完了' ? order.status !== '納品済み' :
                    activeFilter === '納品済み' ? order.status === '納品済み' :
                      activeFilter === 'タスクあり' ? hasTask :
                        order.category === activeFilter;

        const matchDateRange = isInRange(order.date);

        const allergyText = (order.allergyMaster?.people || [])
          .map(p => [p.personName, p.primary?.join(' '), p.finalNg, p.note].join(' '))
          .join(' ');

        const itemText = (order.items || [])
          .map(item => [item.type, item.name, item.notes, item.options?.join(' ')].join(' '))
          .join(' ');

        const haystack = [order.clientName, order.venue, order.orderNotes, itemText, allergyText].join(' ').toLowerCase();

        return matchFilter && matchDateRange && (!q || haystack.includes(q));
      });

      orders.sort((a, b) =>
        sort === 'dateAsc'
          ? `${a.date}${a.time || ''}`.localeCompare(`${b.date}${b.time || ''}`)
          : sort === 'dateDesc'
            ? `${b.date}${b.time || ''}`.localeCompare(`${a.date}${a.time || ''}`)

          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  [...els.ordersList.querySelectorAll('[data-delete]')].forEach(btn =>
    btn.addEventListener('click', () => deleteOrder(btn.dataset.delete))
  );

  [...els.ordersList.querySelectorAll('[data-edit]')].forEach(btn =>
    btn.addEventListener('click', () => editOrder(btn.dataset.edit))
  );

  [...els.ordersList.querySelectorAll('[data-next]')].forEach(btn =>
    btn.addEventListener('click', () => advanceStatus(btn.dataset.next))
  );
  [...els.ordersList.querySelectorAll('tbody tr')].forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;

      const id = row.dataset.orderId;
      const order = loadOrders().find(o => o.id === id);
      if (!order) return;

      showOrderDetail(order);
    });
  });
}

    function deleteOrder(id) {
      if (!window.confirm('この注文を削除しますか？')) return;
      saveOrders(loadOrders().filter(order => order.id !== id));
      renderOrders();
    }

    function advanceStatus(id) {
      const orders = loadOrders(); const index = orders.findIndex(order => order.id === id); if (index === -1) return;
      const now = statusFlow.indexOf(orders[index].status); orders[index].status = statusFlow[Math.min(now + 1, statusFlow.length - 1)] || '未確認'; saveOrders(orders); renderOrders();
    }

    function editOrder(id) {
      const order = loadOrders().find(row => row.id === id); if (!order) return;
      editingId = id; selectedCategory = order.category; renderCategories(); applyCategoryUI(); syncCategoryButtons();
      els.submitBtn.textContent = '更新する';
      els.orderDate.value = order.date || ''; els.orderTime.value = order.time || ''; els.clientName.value = order.clientName || ''; els.venue.value = order.venue || ''; els.guestCount.value = order.guestCount || ''; els.coursePrice.value = order.coursePrice || ''; els.status.value = order.status || '未確認'; els.afternoonTeaType.value = order.afternoonTeaType || ''; els.orderNotes.value = order.orderNotes || '';
      els.itemsArea.innerHTML = ''; els.masterAllergyArea.innerHTML = '';
      (order.allergyMaster?.people || []).forEach(person => addMasterAllergyPerson(person));
      if (!(order.allergyMaster?.people || []).length) addMasterAllergyPerson();
      (order.items || []).forEach(item => {
        addItem(item.type || 'その他');
        const card = els.itemsArea.lastElementChild;
        card.querySelector('.item-type').value = item.type || 'その他';
        card.querySelector('.item-name').value = item.name || '';
        card.querySelector('.item-quantity').value = item.quantity || 1;
        card.querySelector('.item-cost').value = item.cost || '';
        card.querySelector('.cake-size').value = item.size || '';
        card.querySelector('.square-size').value = item.squareSize || '';
        card.querySelector('.multi-size').value = item.multiSize || '';
        card.querySelector('.plate-message').value = item.plateMessage || '';
        card.querySelector('.dessert-cost-note').value = item.dessertCostNote || '';
        card.querySelector('.item-notes').value = item.notes || '';
        [...card.querySelectorAll('.option-check')].forEach(check => { check.checked = (item.options || []).includes(check.value); });
        const freeOptions = (item.options || []).filter(opt => !presetOptions.includes(opt));
        card.querySelector('.option-free').value = freeOptions.join(' / ');
        card.querySelector('.item-type').dispatchEvent(new Event('change'));
        card.querySelector('.cake-size').dispatchEvent(new Event('change'));
      });
      closePrintCards(); closeMonthlyReport(); closeTaskModal(); window.scrollTo({ top: 0, behavior: 'smooth' });
      viewToggle
        .querySelector('[data-view="form"]')
        .click();
    }
    function shortCategory(category) {
      if (category === '婚礼') return 'BR';
      if (category === 'アニバーサリー') return 'AVS';
      if (category === '宴会') return 'BQ';
      if (category === 'アフタヌーンティー') return 'AT';
      return category || '';
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const week = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
      return `${m}/${day}(${week})`;
    }
    function buildPrintCards() {
      const cards = [];

      loadOrders().forEach(order => {
        (order.allergyMaster?.people || []).forEach((person, idx) => {
          const ngFamily = roseFamily.filter(name => person.familyChecks?.[name] === 'NG');
          const relevantFoods = getRelevantFamilyFoods(person.primary || []);
          const checkedFamilies = relevantFoods.filter(name => {
            const status = person.familyChecks?.[name];
            return status === '可' || status === 'NG';
          });

          const rawName = (person.personName || '').trim();
          const isAutoName = /^\d+人目$/.test(rawName);
          const displayName = rawName && !isAutoName ? rawName : (order.clientName || '名前未入力');

          cards.push({
            badge: `${idx + 1}人目`,
            guestName: displayName,
            categoryShort: shortCategory(order.category),
            dateVenue: `${formatShortDate(order.date)} / ${order.venue || ''}`,
            primary: (person.primary || []).join(' / '),
            familyChecked: relevantFoods.length > 0 && checkedFamilies.length === relevantFoods.length,
            familyNg: ngFamily.join(' / '),
            finalNg: person.finalNg || '',
            method: person.method || '',
            note: person.note || ''
          });
        });
      });

      return cards;
    }
    function openPrintCards() {
      const cards = buildPrintCards();
      if (!cards.length) return window.alert('アレルギー情報が入った対象者がありません。');

      els.printCardsArea.innerHTML = cards.map(card => {
        const lines = [];

        if (card.primary) {
          lines.push(`<div class="compact-line"><strong>主</strong> ${escapeHtml(card.primary)}</div>`);
        }

        if (card.familyChecked) {
          if (card.familyNg) {
            lines.push(`<div class="compact-line"><strong>同科</strong> 確認済み / NG ${escapeHtml(card.familyNg)}</div>`);
          } else {
            lines.push(`<div class="compact-line"><strong>同科</strong> 確認済み</div>`);
          }
        }

        if (card.finalNg) {
          lines.push(`<div class="compact-line"><strong>最終</strong> ${escapeHtml(card.finalNg)}</div>`);
        }

        if (card.method) {
          lines.push(`<div class="compact-line"><strong>対応</strong> ${escapeHtml(card.method)}</div>`);
        }

        if (card.note) {
          lines.push(`<div class="compact-line"><strong>メモ</strong> ${escapeHtml(card.note)}</div>`);
        }

        if (!lines.length) {
          lines.push(`<div class="compact-line compact-empty">特記事項なし</div>`);
        }

        return `
      <article class="allergy-card compact">
        <div class="allergy-head compact-head">
          <div class="compact-main">
            <div class="allergy-title compact-title">${escapeHtml(card.guestName)} / ${escapeHtml(card.categoryShort)}</div>
            <div class="allergy-sub compact-sub">${escapeHtml(card.dateVenue)}</div>
          </div>
          <div class="person-badge">${escapeHtml(card.badge)}</div>
        </div>
        ${lines.join('')}
      </article>
    `;
      }).join('');

      els.printModal.classList.remove('hidden');
    }
    function closePrintCards() { els.printModal.classList.add('hidden'); }

    function buildTaskData() {
      const checks = loadTaskChecks();
      const dateFilter = els.taskDateFilter.value || 'all';
      const categoryFilter = els.taskCategoryFilter.value || 'all';
      const typeFilter = els.taskTypeFilter.value || 'all';
      return loadOrders().filter(order => {
        const hasUncheckedFamily = (order.allergyMaster?.people || []).some(person => {
          const relatedFoods = getRelevantFamilyFoods(person.primary || []);
          return relatedFoods.some(food => (person.familyChecks?.[food] || '未確認') === '未確認');
        });
        const hasTaskBase = ['未確認', '製造待ち'].includes(order.status) || hasUncheckedFamily;
        if (!hasTaskBase) return false;
        if (categoryFilter !== 'all' && order.category !== categoryFilter) return false;
        if (dateFilter === 'today' && order.date !== todayStr(0)) return false;
        if (dateFilter === 'tomorrow' && order.date !== todayStr(1)) return false;
        if (dateFilter === 'thisWeek' && !isThisWeek(order.date)) return false;
        return true;
      }).map(order => {
        const entries = [];
        if (order.status === '未確認') {
          const key = `${order.id}::confirm`;
          entries.push({ key, label: '内容確認', detail: `${order.category} / ${order.clientName}`, checked: !!checks[key] });
        }
        if (order.status === '製造待ち') {
          (order.items || []).forEach((item, index) => {
            const key = `${order.id}::prep::${index}`;
            entries.push({ key, label: '仕込み', detail: `${item.name || item.type} × ${item.quantity || 1}`, checked: !!checks[key] });
          });
        }
        (order.allergyMaster?.people || []).forEach((person, personIndex) => {
          const relatedFoods = getRelevantFamilyFoods(person.primary || []);
          const uncheckedFamilies = relatedFoods.filter(food => (person.familyChecks?.[food] || '未確認') === '未確認');
          if (!uncheckedFamilies.length) return;
          const key = `${order.id}::family::${personIndex}`;
          entries.push({ key, label: '同科確認', detail: `${person.personName || `${personIndex + 1}人目`} / ${uncheckedFamilies.join('・')}`, checked: !!checks[key] });
        });
        const filteredEntries = typeFilter === 'all' ? entries : entries.filter(entry => entry.label === typeFilter);
        return { title: order.clientName, meta: `${order.category} / ${order.date || ''}${order.time ? ` ${order.time}` : ''} / ${order.venue || '場所未入力'}`, status: order.status, entries: filteredEntries };
      }).filter(group => group.entries.length);
    }

    function renderTaskModal() {
      const tasks = buildTaskData();
      if (!tasks.length) { els.taskListArea.innerHTML = '<div class="empty">未確認・製造待ち・同科未確認のタスクはありません。</div>'; return; }
      els.taskListArea.innerHTML = tasks.map(group => `
        <article class="task-card">
          <div class="task-head"><div><div class="task-title">${escapeHtml(group.title || '名称未入力')}</div><div class="meta">${escapeHtml(group.meta)}</div></div><div class="badge">${escapeHtml(group.status)}</div></div>
          ${group.entries.map(entry => `
            <label class="task-check ${entry.checked ? 'done' : ''}" data-task-wrap="${escapeHtml(entry.key)}">
              <input type="checkbox" data-task-key="${escapeHtml(entry.key)}" ${entry.checked ? 'checked' : ''} />
              <div><strong>${escapeHtml(entry.label)}</strong><br><span class="meta">${escapeHtml(entry.detail)}</span></div>
            </label>
          `).join('')}
        </article>
      `).join('');
      [...els.taskListArea.querySelectorAll('[data-task-key]')].forEach(input => input.addEventListener('change', () => {
        const checks = loadTaskChecks(); checks[input.dataset.taskKey] = input.checked; saveTaskChecks(checks); input.closest('[data-task-wrap]')?.classList.toggle('done', input.checked);
      }));
    }
    function openTaskModal() { renderTaskModal(); els.taskModal.classList.remove('hidden'); }
    function closeTaskModal() { els.taskModal.classList.add('hidden'); }
    function buildMonthlyReport(monthStr) {
      const [year, month] = monthStr.split('-').map(Number);

      const orders = loadOrders().filter(order => {
        if (order.status !== '納品済み') return false;
        if (!order.date) return false;

        const d = new Date(order.date + 'T00:00:00');
        return d.getFullYear() === year && d.getMonth() + 1 === month;
      });

      const result = {
        orderCount: orders.length,
        totalCost: 0,
        categoryCount: {},
        sizeCount: {},
        itemTypeCount: {},
        optionCount: {},
        customerCount: {}
      };

      orders.forEach(order => {
        result.categoryCount[order.category] = (result.categoryCount[order.category] || 0) + 1;
        result.customerCount[order.clientName || '名前未入力'] = (result.customerCount[order.clientName || '名前未入力'] || 0) + 1;

        (order.items || []).forEach(item => {
          const qty = Number(item.quantity || 0);
          const cost = Number(item.cost || 0);

          result.totalCost += cost * qty;
          result.itemTypeCount[item.type || '未分類'] = (result.itemTypeCount[item.type || '未分類'] || 0) + qty;

          const sizeText = item.multiSize || item.size || '';

          if (sizeText) {
            sizeText
              .split(/[＋+\s、,／/]+/)
              .map(s => s.trim())
              .filter(Boolean)
              .forEach(size => {
                result.sizeCount[size] = (result.sizeCount[size] || 0) + qty;
              });
          }

          (item.options || []).forEach(opt => {
            result.optionCount[opt] = (result.optionCount[opt] || 0) + 1;
          });
        });
      });

      return result;
    }
    function mapToRows(mapObj, suffix = '') {
      const entries = Object.entries(mapObj).sort((a, b) => b[1] - a[1]);
      if (!entries.length) return '<div class="empty">該当データなし</div>';
      return `<div class="report-list">${entries.map(([k, v]) => `<div class="report-card"><div class="report-row"><span>${escapeHtml(k)}</span><strong>${Number(v).toLocaleString()}${suffix}</strong></div></div>`).join('')}</div>`;
    }
    function runMonthlyReport() {
      const monthStr = els.reportMonthInput.value || currentMonthStr(); const report = buildMonthlyReport(monthStr); const [year, month] = monthStr.split('-');
      els.reportSummary.innerHTML = `
        <div class="badge-row" style="margin-bottom:14px;">
          <span class="badge">${year}年${Number(month)}月</span>
          <span class="badge">納品済み予約 ${report.orderCount}件</span>
          <span class="badge">原価合計 ${report.totalCost.toLocaleString()}円</span>
        </div>
        <div class="grid-2">
          <div class="report-card"><div class="report-title">カテゴリ別</div>${mapToRows(report.categoryCount, '件')}</div>
          <div class="report-card"><div class="report-title">商品区分別数量</div>${mapToRows(report.itemTypeCount, '点')}</div>
          <div class="report-card"><div class="report-title">サイズ別数量</div>${mapToRows(report.sizeCount, '台')}</div>
          <div class="report-card"><div class="report-title">オプション使用回数</div>${mapToRows(report.optionCount, '回')}</div>
          <div class="report-card" style="grid-column:1 / -1;"><div class="report-title">顧客別件数</div>${mapToRows(report.customerCount, '件')}</div>
        </div>`;
    }
    function openMonthlyReport() {
      els.reportMonthInput.value = currentMonthStr();
      runMonthlyReport();
      els.reportModal.classList.remove('hidden');
    }
    function closeMonthlyReport() { els.reportModal.classList.add('hidden'); }

    async function handleJsonImport(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed)) {
            return window.alert('JSONの形式が正しくありません。配列データを読み込んでください。');
          }

          const normalized = parsed.map(normalizeImportedOrder);
          const shouldAppend = window.confirm('OKで追加読み込み、キャンセルで上書き読み込みします。');
          const existing = loadOrders();
          let finalOrders;

          if (shouldAppend) {
            const merged = [...existing];

            normalized.forEach(newOrder => {
              if (!existing.some(o => o.id === newOrder.id)) {
                merged.push(newOrder);
              }
            });

            finalOrders = merged;
          } else {
            finalOrders = normalized;
          }

          saveOrders(finalOrders);
          rebuildVenueMemoryFromOrders(finalOrders);
          renderOrders();
          resetForm();

          window.alert(`JSONを${shouldAppend ? '追加' : '上書き'}反映しました。`);
        } catch (error) {
          console.error(error);
          window.alert('JSONの読み込みに失敗しました。');
        } finally {
          event.target.value = '';
        }
      };

      reader.onerror = function () {
        window.alert('ファイルの読み込みに失敗しました。');
        event.target.value = '';
      };

      reader.readAsText(file, 'utf-8');
    }

    function exportJson() {
      const data = JSON.stringify(loadOrders(), null, 2); const blob = new Blob([data], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `orders-v7-${todayStr(0)}.json`; a.click(); URL.revokeObjectURL(url);
    }
    function clearAll() {
      if (!window.confirm('全件削除します。元に戻せません。')) return;

      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(TASK_CHECK_KEY);

      resetForm();
      renderOrders();
    }

    viewToggle.addEventListener('click', (e) => {
      if (!e.target.dataset.view) return;

      document.querySelectorAll('#viewToggle .pill').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');

      if (e.target.dataset.view === 'form') {
        formSection.classList.remove('view-hidden');
        listSection.classList.add('view-hidden');
      } else {
        formSection.classList.add('view-hidden');
        listSection.classList.remove('view-hidden');
      }
    });

    fromDate.addEventListener('change', renderOrders);
    toDate.addEventListener('change', renderOrders);

    clearDateFilterBtn.addEventListener('click', () => {
      fromDate.value = '';
      toDate.value = '';
      renderOrders();
    });
    els.addMasterAllergyBtn.addEventListener('click', () => addMasterAllergyPerson());
    els.addItemBtn.addEventListener('click', () => addItem('その他'));
    els.addDessertBtn.addEventListener('click', () => addItem('皿盛りデザート'));
    els.addCakeBtn.addEventListener('click', () => addItem(selectedCategory === '婚礼' ? 'ウエディングケーキ' : selectedCategory === 'アニバーサリー' ? 'アニバーサリーケーキ' : 'ホールケーキ'));
    els.addGiftBtn.addEventListener('click', () => addItem('ギフト'));
    els.orderForm.addEventListener('submit', handleSubmit);
    els.searchInput.addEventListener('input', renderOrders);
    els.sortSelect.addEventListener('change', renderOrders);
    els.importJsonBtn.addEventListener('click', () => els.importJsonInput.click());
    els.importJsonInput.addEventListener('change', handleJsonImport);
    els.exportBtn.addEventListener('click', exportJson);
    els.printCardsBtn.addEventListener('click', openPrintCards);
    els.taskModalBtn.addEventListener('click', openTaskModal);
    els.taskDateFilter.addEventListener('change', renderTaskModal);
    els.taskCategoryFilter.addEventListener('change', renderTaskModal);
    els.taskTypeFilter.addEventListener('change', renderTaskModal);
    els.monthlyReportBtn.addEventListener('click', openMonthlyReport);
    els.runPrintBtn.addEventListener('click', () => window.print());
    els.closePrintBtn.addEventListener('click', closePrintCards);
    els.closeTaskBtn.addEventListener('click', closeTaskModal);
    els.runReportBtn.addEventListener('click', runMonthlyReport);
    els.closeReportBtn.addEventListener('click', closeMonthlyReport);
    els.resetFormBtn.addEventListener('click', () => resetForm());
    els.clearAllBtn.addEventListener('click', clearAll);

    renderSavedVenues();
    renderCategories();
    renderFilterPills();
    applyCategoryUI();
    syncCategoryButtons();
    resetForm();
    listSection.classList.add('view-hidden');
    renderOrders();
    document.querySelectorAll('.section-header').forEach(header => {

      header.addEventListener('click', () => {

        header.nextElementSibling.classList.toggle('hidden');

      });

    });
  </script>
